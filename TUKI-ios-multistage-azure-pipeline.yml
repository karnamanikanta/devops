    - job: TUKI_Sonarqube
      pool:
        name: Azure Pipelines
        vmImage: macOS-15
        demands:
          - xcode 
      displayName: 'Production_Sonarqube'
      timeoutInMinutes: 0
      cancelTimeoutInMinutes: 2
      variables:
          - template: TUKI/variables/var-sonarqube-flavor.yml
      steps:
          - template: TUKI/SonarQube/ios-sonarqube-template.yml
          - powershell: |
             echo "SonarQube URL from template: $(SonarQubeBranchURL)"
             echo "##vso[task.setvariable variable=SonarQubeBranchURL;isOutput=true]$(SonarQubeBranchURL)"
            name: DisplayReleaseDetails

    - job: SendEmail
      dependsOn: 
        - TUKI_PROD
        - TUKI_Sonarqube
      displayName: 'Send Email Notification'
      pool:
        name: SubwaycomOn-PremAgentPool
      condition: |
        and(
          in(dependencies.TUKI_PROD.result, 'Succeeded', 'SucceededWithIssues'),
          in(dependencies.TUKI_Sonarqube.result, 'Succeeded', 'SucceededWithIssues', 'Failed')
        )
      variables:
        AppVersion: $[ dependencies.TUKI_PROD.outputs['DisplayReleaseDetails.AppVersion'] ]
        BuildNumber: $[ dependencies.TUKI_PROD.outputs['DisplayReleaseDetails.BuildNumber'] ]
        FirebaseURL: $[ dependencies.TUKI_PROD.outputs['DisplayReleaseDetails.FirebaseURL'] ]
        FirebaseConsoleURL: $[ dependencies.TUKI_PROD.outputs['DisplayReleaseDetails.FirebaseConsoleURL'] ]
        FirebaseReleaseURL: $[ dependencies.TUKI_PROD.outputs['DisplayReleaseDetails.FirebaseReleaseURL'] ]
        FirebaseAppDistribution: 'SUBWAY iOS TUKI Production'
        SonarQubeBranchURL: $[ dependencies.TUKI_Sonarqube.outputs['DisplayReleaseDetails.SonarQubeBranchURL'] ]
      steps:
      - checkout: none
      - template: TUKI/template/TUKI_PROD_send_email_template.yml
      
