name: $(Rev:r)
variables:
    - group: EmailRecipients
    - group: P12Password_Lowersandprod
    - template: NA/variables/var-CFAUAT-NA-flavor.yml
resources:
  repositories:
    - repository: goldsuite
      type: git
      name: QE.UI.Automation.Digital.CICD
      ref: refs/heads/main

pool:
   name: Azure Pipelines
   vmImage: macOS-15
   demands:
     - xcode

stages:
- stage: Subway_IOS_NA_GatedBuild
  jobs:
  - job: UAT_BuildAndRelease_GatedBuild
    timeoutInMinutes: 0
    cancelTimeoutInMinutes: 2
    steps:
    - task: PowerShell@2
      displayName: 'Pull Request Mandatory Checks'
      inputs:
        targetType: 'inline'
        script: |
          $ErrorActionPreference = "Stop"
          $Error.Clear()
          
          Try {
              # Get system access token
              $Token = $env:SYSTEM_ACCESSTOKEN
              $headers = @{Authorization = "Bearer $Token"}
              
              # Get PR ID dynamically from build variables
              $prId = $env:SYSTEM_PULLREQUEST_PULLREQUESTID
              
              # Construct PR URL dynamically
              $organization = "subwaytechnology"
              $project = "Guest-MobileApps"
              $Pullrequrl = "https://dev.azure.com/$organization/$project/_apis/git/pullrequests/$prId`?api-version=6.0"
              
              # Get PR details
              $pullreqResponse = Invoke-RestMethod -Method Get -Uri $Pullrequrl -Headers $headers
              $prDescription = $pullreqResponse.description

              if ([string]::IsNullOrEmpty($prDescription)) {
                  Write-Host "PR Description is empty!"
                  exit 1  # Fail the build if description is empty
              } else {
                  Write-Host "PR Description is provided."
              }
              
              # Define mandatory checkboxes that must be checked
              $mandatoryCheckboxes = @(
                  "I have added unit tests to cover my changes, if applicable.",
                  "All existing tests pass.",
                  "Code follows the style guidelines and best practices.",
                  "Make sure no hardcoded values in the pull request code",
                  "Does the PR title follow the correct format?",
                  "Is the PR linked to the relevant PBI, BUG, Code Review Task, or Unit Testing Task?",
                  "Has this pull request been tested on a physical device and/or emulator?",
                  "Does the implementation follow [best practices](https://subwaytechnology.visualstudio.com/Guest-MobileApps/_wiki/wikis/Guest-MobileApps.wiki/7275/Best-Practices-for-Developers)?",
                  "Is the code well-documented and easy to understand?",
                  "Do all existing Unit Tests pass?",
                  "If there are UI changes, have before and after screenshots/Gif been added?"
              )
              
              # # Define recommended checkboxes that should be reviewed
               $recommendedCheckboxes = @(
                   "Bug fix (non-breaking change which fixes an issue)",
                   "New feature (non-breaking change which adds functionality)",
                   "Breaking change (fix or feature that would cause existing functionality to not work as expected)",
                   "UI Polish (improve the appearance and usability of the interface without altering its functionality)",
                   "Refactoring (improve the quality or maintainability of the code without changing any functionality)",
                   "Localization (support a new language or improve the translation of an existing language)",
                   "Tech Debt (change made to address technical debt or to improve the overall quality)",
                   "I have added Adobe Analytics to cover my changes, if applicable.",
                   "North America",
                   "FINLAND",
                   "TUKI",
                   "GERMANY",
                   " Code is well-documented and easy to understand.",
                   "Accessibility changes made in this pull request."
                )    
              
              $hasErrors = $false
              
              Write-Host "##[section]Checking Mandatory Items..."
              # Check mandatory checkboxes
              foreach ($checkbox in $mandatoryCheckboxes) {
                  $checkboxPattern = "- \[ \] $checkbox"  # Unchecked pattern
                  $checkedPattern = "- \[x\] $checkbox"   # Checked pattern

              # Special handling for checkboxes containing URLs
              if ($checkbox -match "\[(.*?)\]\((https?:\/\/[^\s]+)\)") {
                  $checkboxPattern = "- \[\s\] .*?\[(.*?)\]\((https?:\/\/[^\s]+)\).*"
                  $checkedPattern = "- \[x\] .*?\[(.*?)\]\((https?:\/\/[^\s]+)\).*"
              }                  
                  
                  if ($prDescription -match $checkboxPattern) {
                      Write-Host "##vso[task.logissue type=error]Mandatory checkbox '$checkbox' is not checked."
                      $hasErrors = $true
                  }
                  elseif (!($prDescription -match $checkedPattern)) {
                      Write-Host "##vso[task.logissue type=error]Mandatory checkbox '$checkbox' is missing from PR description."
                      $hasErrors = $true
                  }
              }
              
              # Write-Host "##[section]Checking Recommended Items..."
              # # Check recommended checkboxes and provide warnings
              # foreach ($checkbox in $recommendedCheckboxes) {
              #     $checkboxPattern = "- \[ \] $checkbox"  # Unchecked pattern
              #     $checkedPattern = "- \[x\] $checkbox"   # Checked pattern
                  
              #     if ($prDescription -match $checkboxPattern) {
              #         Write-Host "##vso[task.logissue type=warning]Recommended checkbox '$checkbox' is not checked."
              #     }
              #     elseif (!($prDescription -match $checkedPattern)) {
              #         Write-Host "##vso[task.logissue type=warning]Recommended checkbox '$checkbox' is missing from PR description."
              #     }
              # }
              
              if ($hasErrors) {
                  Write-Host "##vso[task.complete result=Failed;]"
                  Write-Error "One or more mandatory checkboxes are not checked. Please review and update your PR description."
                  exit 1
              }
              
              Write-Host "##[section]All mandatory checkboxes are properly checked."
          }
          catch {
              Write-Error ($_.Exception | Format-List -Force | Out-String) -ErrorAction Continue
              Write-Error ($_.InvocationInfo | Format-List -Force | Out-String) -ErrorAction Continue
              exit 1
          }
      env:
        SYSTEM_ACCESSTOKEN: $(system.accesstoken)

