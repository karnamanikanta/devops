    - task: InstallAppleCertificate@2
      displayName: 'Install an Apple certificate'
      inputs:
        certSecureFile: 'Lowers_Certificates.p12'
        certPwd: '$(NonProd_p12password)'

    - task: InstallAppleProvisioningProfile@1
      displayName: 'Install sandboxmobile_richnotification PF'
      inputs:
        provisioningProfileLocation: 'secureFiles'
        provProfileSecureFile: 'comsubwaysandboxmobilerichnotification_03022027.mobileprovision'

    - task: InstallAppleProvisioningProfile@1
      displayName: 'Install sandboxmobile_match_InHouse PF'
      inputs:
        provisioningProfileLocation: 'secureFiles'
        provProfileSecureFile: 'match_InHouse_comsubwaysandboxmobile_03022027.mobileprovision'

    - task: InstallAppleProvisioningProfile@1
      displayName: 'Install sandboxmobile_siriintent PF'
      inputs:
        provisioningProfileLocation: 'secureFiles'
        provProfileSecureFile: 'sandbox_comsubwaysandboxmobilesiriintent_03022027.mobileprovision'

    - task: InstallAppleProvisioningProfile@1
      displayName: 'Install sandboxmobile_siriintentui PF'
      inputs:
        provisioningProfileLocation: 'secureFiles'
        provProfileSecureFile: 'sandbox_comsubwaysandboxmobilesiriintentui_03022027.mobileprovision'

    - task: DownloadSecureFile@1
      name: downloadFirebasecredentials
      displayName: 'Download Firebase Credentials'
      inputs:
        secureFile: '49f11de0-994c-4e78-822f-7263ec835e6b'


    - task: Bash@3
      displayName: 'Set build number and Generate Podfile.lock hash'
      name: buildnumber
      inputs:
        targetType: 'inline'
        script: |
          PODFILE_LOCK_HASH=$(shasum -a 256 $(Build.SourcesDirectory)/Subway/Podfile.lock | awk '{print $1}')
          echo "##vso[task.setvariable variable=PODFILE_LOCK_HASH]$PODFILE_LOCK_HASH"
          echo "podfile.lock hash $PODFILE_LOCK_HASH"
          Ver_String="$(defaults read $SYSTEM_DEFAULTWORKINGDIRECTORY/Subway/Source/NA-Info CFBundleShortVersionString)"
          echo "Version_String=$Ver_String"
          Build_Number_FromFile="$(defaults read $SYSTEM_DEFAULTWORKINGDIRECTORY/Subway/Source/NA-Info CFBundleVersion)"
          Number="$BUILD_BUILDNUMBER"
          Updated_Build_Number=$(($Build_Number_FromFile + $Number))
          echo "Updated_build_number=$Updated_Build_Number"
          echo "##vso[task.setvariable variable=UPDATED_BUILD_NUMBER;isOutput=true]$Updated_Build_Number"
          ruby $SYSTEM_DEFAULTWORKINGDIRECTORY/setBuildNumber.rb "$SYSTEM_DEFAULTWORKINGDIRECTORY/Subway/Source/NA-Info.plist" $Updated_Build_Number
          ruby $SYSTEM_DEFAULTWORKINGDIRECTORY/setBuildNumber.rb "$SYSTEM_DEFAULTWORKINGDIRECTORY/Subway/Source/NA QE1-Info.plist" $Updated_Build_Number
          ruby $SYSTEM_DEFAULTWORKINGDIRECTORY/setBuildNumber.rb "$SYSTEM_DEFAULTWORKINGDIRECTORY/Subway/SiriIntent/Info.plist" $Updated_Build_Number
          ruby $SYSTEM_DEFAULTWORKINGDIRECTORY/setBuildNumber.rb "$SYSTEM_DEFAULTWORKINGDIRECTORY/Subway/SiriIntentUI/Info.plist" $Updated_Build_Number
          ruby $SYSTEM_DEFAULTWORKINGDIRECTORY/setBuildNumber.rb "$SYSTEM_DEFAULTWORKINGDIRECTORY/Subway/RichNotification/Info.plist" $Updated_Build_Number

    - task: Cache@2
      displayName: 'Cache CocoaPods dependencies'
      inputs:
        key: 'goldsuitepods | "$(Agent.OS)" | $(PODFILE_LOCK_HASH)'
        path: '$(Build.SourcesDirectory)/Subway/Pods'
        cacheHitVar: 'PODS_CACHE_RESTORED'

    - task: PowerShell@2
      enabled: true
      displayName: 'PFs override'
      inputs:
        targetType: 'inline'
        script: |
          $GetFilePath="$Env:BUILD_SOURCESDIRECTORY\Subway\Subway.xcodeproj\project.pbxproj"
          (Get-Content $GetFilePath).replace('Development RichNotification', 'com.subway.sandbox.mobile.richnotification') | Set-Content $GetFilePath -Force
          (Get-Content $GetFilePath).replace('Development com.subway.sandbox.siriintentui', 'sandbox com.subway.sandbox.mobile.siriintentui') | Set-Content $GetFilePath -Force
          (Get-Content $GetFilePath).replace('Development com.subway.sandbox.mobile', 'match InHouse com.subway.sandbox.mobile') | Set-Content $GetFilePath -Force
          (Get-Content $GetFilePath).replace('Development com.subway.sandbox.siriintent', 'sandbox com.subway.sandbox.mobile.siriintent') | Set-Content $GetFilePath -Force

    - task: Bash@3
      enabled: true
      displayName: 'Fastlane gym Xcode Build'
      name: relapp
      inputs:
        targetType: 'inline'
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          cd $SYSTEM_DEFAULTWORKINGDIRECTORY/Subway
          
          # ----- CONFIG -----
          BUNDLER_VERSION="${BUNDLER_VERSION:-2.4.22}"   # Fastlane requires Bundler 2.x
          echo "Ruby info:"
          which ruby || true
          ruby -v || true

          echo "Ensuring Bundler ${BUNDLER_VERSION} is installed (we will NOT use the global shim)..."
          gem uninstall -aIx bundler || true
          gem install bundler -v "${BUNDLER_VERSION}"

          # Create a project-local Bundler wrapper
          mkdir -p ./bin
          cat > ./bin/bundle <<'RUBY_WRAPPER'
          #!/usr/bin/env ruby
          require 'rubygems'
          FORCED_VERSION = ENV.fetch('FORCED_BUNDLER_VERSION')
          gem 'bundler', "= #{FORCED_VERSION}"
          load Gem.bin_path('bundler', 'bundle', FORCED_VERSION)
          RUBY_WRAPPER
          export FORCED_BUNDLER_VERSION="${BUNDLER_VERSION}"
          chmod +x ./bin/bundle

          echo "Wrapper bundle version (should be ${BUNDLER_VERSION}):"
          ./bin/bundle -v

          echo "Running bundle install (local then remote fallback)..."
          ./bin/bundle install --local || ./bin/bundle install

          if [ ! -f Gemfile.lock ]; then
            echo "Gemfile.lock missing—creating with Bundler ${BUNDLER_VERSION}..."
            ./bin/bundle install
          fi
          grep -A2 "BUNDLED WITH" Gemfile.lock || true

          # ----- Fastlane environment -----
          export FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT=600
          export FASTLANE_XCODEBUILD_SETTINGS_RETRIES=6
          
          GetFileNamePath="$(downloadFirebasecredentials.secureFilePath)"
          # Get file directory and name
          GetFileDirectory=$(dirname "$GetFileNamePath")
          GetFileName=$(basename "$GetFileNamePath")
          # Print file directory and name
          echo "$GetFileDirectory"
          echo "$GetFileName"
          export SECUREFILEPATH="$GetFileDirectory/$GetFileName"
          
          set +e
          echo "Running Fastlane for variant: $(BuildVariant)"
          ./bin/bundle exec fastlane "$(lane)" $(BuildVariant) 2>&1 | tee fastlane_output.log
          FASTLANE_EXIT_CODE=$?
          set -e
 
          BUILD_OUTPUT=$(cat fastlane_output.log)
          echo "$BUILD_OUTPUT"
      continueOnError: false

  - job: StoreValidationAndNotification
    displayName: 'Store Validation and Notification'
    pool:
      name: SubwaycomOn-PremAgentPool
    steps:
      - checkout: none
      - task: PowerShell@2
        enabled: false
        displayName: 'Store Status Validation'
        name: storestatuscheck
        inputs:
          targetType: 'inline'
          script: |
            function Validate-StoreStatus {
                $result = @{
                    isOpen = $false
                    isOnline = $false
                    isDrawerAvailable = $false
                    storeStatus = $false
                }
          
                # Get environment and store information from system properties
                $environment = "uat"
                $store = "$(storeid)"
                $accessToken = Get-AccessToken
                # Construct the API request URL
                $url = "https://$environment-api.test.subway.com/fresh-location/v1/locations/$store-0/status"
          
                # Setup HTTP client and headers
                $headers = @{
                    "Content-Type" = "application/json"
                    "Authorization" = "Bearer $accessToken"
                }
          
                # Retry logic (up to 3 times)
                for ($iteration = 1; $iteration -le 3; $iteration++) {
                    try {
                        # Make the GET request
                        $response = Invoke-RestMethod -Uri $url -Method Get -Headers $headers -ErrorAction Stop
                        # Check if the response is successful (HTTP status code 200)
                        if ($response -ne $null) {
                            # Parse JSON response and check store status
                            $result.isOpen = $response.isOpen
                            $result.isOnline = $response.isOnline
                            $result.isDrawerAvailable = $response.isDrawerAvailable
          
                            $result.storeStatus = $result.isOpen -and $result.isOnline -and $result.isDrawerAvailable
                            break
                        }
                    }
                    catch {
                        Write-Host "Error occurred executing Store status API: $_"
                        Write-Host "Retrying store status API..."
                    }
                    # Optional: Add delay between retries (e.g., 1 second)
                    Start-Sleep -Seconds 1
                }
          
                # Return the store status
                return $result
            }
          
            function Get-AccessToken {
                $headers = @{
                    "x-api-key" = "$(apikey)"
                    "Content-Type" = "application/json"
                }
          
                $body = @{
                    eventData = @{
                        environment = "cfa-uat"
                        country = "US"
                        Email = "auto-reg@qasubway.com"
                        password = "$(storecheckpassword)"
                    }
                } | ConvertTo-Json -Depth 10
          
                $response = Invoke-RestMethod -Uri 'https://c73jog9b70.execute-api.us-east-1.amazonaws.com/prod/user/getaccesstoken' `
                                            -Method Post `
                                            -Headers $headers `
                                            -Body $body
                return $response.accessToken
            }
          
            # Call validation and extract results
            $statusResult = Validate-StoreStatus

            $isOpen = $statusResult.isOpen
            $isOnline = $statusResult.isOnline
            $isDrawerAvailable = $statusResult.isDrawerAvailable
            $storeStatus = $statusResult.storeStatus

            # Write-Host "DEBUG: isOpen=$isOpen"
            # Write-Host "DEBUG: isOnline=$isOnline"
            # Write-Host "DEBUG: isDrawerAvailable=$isDrawerAvailable"
            Write-Host "Store status: $storeStatus"

            $EnableGoldSuite = if ($storeStatus) { "true" } else { "false" }
              Write-Host "##vso[task.setvariable variable=EnableGoldSuite;isOutput=true]true"
            Write-Host "##vso[task.setvariable variable=EnableGoldSuite;isOutput=true]$EnableGoldSuite"
            
            Write-Host "EnableGoldSuite value set to: $EnableGoldSuite"

            Write-Host "##vso[task.setvariable variable=isOpen;isOutput=true]$isOpen"
            Write-Host "##vso[task.setvariable variable=isOnline;isOutput=true]$isOnline"
            Write-Host "##vso[task.setvariable variable=isDrawerAvailable;isOutput=true]$isDrawerAvailable"

      - task: PowerShell@2
        displayName: 'Send Store Offline Notification Email'
        condition: eq(variables['storestatuscheck.EnableGoldSuite'], 'false')
        inputs:
          targetType: 'inline'
          script: |
            $smtpServer = "phl.smtp.subwaydai.com"
            $smtpPort = 25
            $fromAddress = "noreply@subway.com"

            # Fetch the To and CC addresses from pipeline variables
            $toAddress = $env:EmailTo -split ","
            $ccAddress = $env:EmailCC -split ","

            $organization = "subwaytechnology"
            $project = "Guest-MobileApps"
            $repoId = $env:BUILD_REPOSITORY_ID

            $prNumber = $env:SYSTEM_PULLREQUEST_PULLREQUESTID
            if ([string]::IsNullOrWhiteSpace($prNumber)) {
              $prNumber = "N/A"
              $prLink = "#"
            } else {
              $prLink ="https://dev.azure.com/$organization/$project/_git/$repoId/pullrequest/$prNumber"
            }

            $storeId = "$(storeid)"
            if ([string]::IsNullOrWhiteSpace($storeId)) {
              $storeId = "Unknown"
            }

            $isOpen = "$(storestatuscheck.isOpen)"
            $isOnline = "$(storestatuscheck.isOnline)"
            $isDrawerAvailable = "$(storestatuscheck.isDrawerAvailable)"
            $buildId = "$(Build.BuildId)"
            $buildUri = "$(Build.BuildUri)"
            $buildLink = "$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$buildId"

            # Convert boolean values to user-friendly strings
            $storeStatus = if ($isOpen -eq "True") { "Open" } else { "Closed" }
            $onlineStatus = if ($isOnline -eq "True") { "Online" } else { "Offline" }
            $drawerStatus = if ($isDrawerAvailable -eq "True") { "Available" } else { "Unavailable" }

            $emailBody = @"
            <!DOCTYPE html>
            <html>
            <head>
              <style>
                body {
                  font-family: Arial, sans-serif;
                  color: #333;
                }
                h2 {
                  color: #D80000;
                }
                table {
                  border-collapse: collapse;
                  width: 600px;
                  margin-top: 10px;
                }
                th {
                  background-color: #003366;
                  color: white;
                  font-size: 16px;
                  text-align: left;
                  padding: 8px;
                }
                td {
                  border: 1px solid #ddd;
                  padding: 6px 10px;
                  vertical-align: top;
                }
                .label-cell {
                  font-weight: bold;
                  background-color: #f2f2f2;
                  width: 200px;
                }
                a {
                  color: #007BFF;
                  text-decoration: none;
                }
              </style>
            </head>
            <body>
              <h2>⚠️ URGENT: Store $storeId is Offline!</h2>
              <p>The status of store <strong>$storeId</strong> indicates it is <strong>offline</strong>.</p>
              <p>Gold Suite execution skipped due to store offline. Please check the store's status and take necessary actions to resolve the issue.</p>

              <table>
                <tr>
                  <th colspan="2">🧪 Pre-Requisites Check Summary</th>
                </tr>
                <tr>
                  <td class="label-cell">Is Store Open</td>
                  <td>$storeStatus</td>
                </tr>
                <tr>
                  <td class="label-cell">Is Store Online</td>
                  <td>$onlineStatus</td>
                </tr>
                <tr>
                  <td class="label-cell">Is Drawer Available</td>
                  <td>$drawerStatus</td>
                </tr>
                <tr>
                  <td class="label-cell">Build ID</td>
                  <td><a href="$buildLink" target="_blank">$buildId</a></td>
                </tr>
                <tr>
                  <td class="label-cell">PR Number</td>
                  <td><a href="$prLink" target="_blank">$prNumber</a></td>
                </tr>
              </table>
              <br/>
              <p>Thank you,<br/><strong>Subway DevOps Team</strong></p>
            </body>
            </html>
            "@

            $mail = New-Object System.Net.Mail.MailMessage
            $mail.From = $fromAddress
            # Add multiple To recipients
            $toAddress.Split(",") | ForEach-Object { $mail.To.Add($_.Trim()) }

            # Add multiple CC recipients (optional)
            if ($ccAddress) {
                $ccAddress.Split(",") | ForEach-Object { $mail.CC.Add($_.Trim()) }
            }

            $mail.Subject = "⚠️ [URGENT] - [Action Required] - iOS Gated Pipeline Alert | Store #$storeId is Offline"
            $mail.IsBodyHtml = $true
            $mail.Body = $emailBody
            $mail.Priority = [System.Net.Mail.MailPriority]::High
            $mail.SubjectEncoding = [System.Text.Encoding]::UTF8

            $smtp = New-Object System.Net.Mail.SmtpClient($smtpServer, $smtpPort)
            $smtp.Send($mail)

      - task: PowerShell@2
        displayName: 'Get PR Details'
        name: GetPR
        inputs:
          targetType: 'inline'
          script: |
            $ErrorActionPreference = "Stop"
            $Error.Clear()

            Try {

              $Token = $env:SYSTEM_ACCESSTOKEN
              $headers = @{ Authorization = "Bearer $Token" }

                function Write-PRDetails {
                  param (
                      [string]$prId,
                      [object]$prDetails
                  )
                  Write-Host "----------------------------------------"
                  Write-Host "Pull Request Details:"
                  Write-Host "----------------------------------------"
                  Write-Host "PR Number: $prId"
                  Write-Host "PR Creator: $($prDetails.createdBy.displayName)"
                  Write-Host "Source Branch: $($prDetails.sourceRefName)"
                  Write-Host "Target Branch: $($prDetails.targetRefName)"
                  Write-Host "PR Title: $($prDetails.title)"
                  Write-Host "----------------------------------------"

                  # Set pipeline variables with isOutput flag
                  Write-Host "##vso[task.setvariable variable=PRNumber;isOutput=true]$prId"
                  Write-Host "##vso[task.setvariable variable=PRCreator;isOutput=true]$($prDetails.createdBy.displayName)"
                  Write-Host "##vso[task.setvariable variable=SourceBranch;isOutput=true]$($prDetails.sourceRefName)"
                  Write-Host "##vso[task.setvariable variable=TargetBranch;isOutput=true]$($prDetails.targetRefName)"
                  Write-Host "##vso[task.setvariable variable=PRTitle;isOutput=true]$($prDetails.title)"
              }

              if ($env:BUILD_SOURCEBRANCH.StartsWith("refs/pull/")) {
                  $prId = $env:BUILD_SOURCEBRANCH -replace "refs/pull/(\d+)/merge", '$1'
                  $prUri = "https://dev.azure.com/subwaytechnology/Guest-MobileApps/_apis/git/pullrequests/$($prId)?api-version=6.0"
                  $prDetails = Invoke-RestMethod -Uri $prUri -Headers $headers -Method Get
                  Write-PRDetails -prId $prId -prDetails $prDetails
                  $prDetails | ConvertTo-Json -Depth 10 | Out-File "pr_details.json"
                  Write-Host "PR details exported to pr_details.json"
              }
              else {
                  Write-Host "This is not a PR build. Current branch: $env:BUILD_SOURCEBRANCH"
                  # Set empty values for pipeline variables in non-PR builds
                  Write-Host "##vso[task.setvariable variable=PRNumber;isOutput=true]"
                  Write-Host "##vso[task.setvariable variable=PRCreator;isOutput=true]"
                  Write-Host "##vso[task.setvariable variable=SourceBranch;isOutput=true]$env:BUILD_SOURCEBRANCH"
                  Write-Host "##vso[task.setvariable variable=TargetBranch;isOutput=true]"
                  Write-Host "##vso[task.setvariable variable=PRTitle;isOutput=true]"
              }
            }
            catch {
              Write-Error "An error occurred while fetching PR details:"
              Write-Error ($_.Exception | Format-List -Force | Out-String) -ErrorAction Continue
              Write-Error ($_.InvocationInfo | Format-List -Force | Out-String) -ErrorAction Continue
              exit 1
            }
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)

- stage: GoldenSuite
  dependsOn: Subway_IOS_NA_GatedBuild
  condition: and(succeeded('Subway_IOS_NA_GatedBuild'),eq(variables['GOLD_SUITE'], 'true'),eq(dependencies.Subway_IOS_NA_GatedBuild.outputs['StoreValidationAndNotification.storestatuscheck.EnableGoldSuite'], 'true'))
  variables:
      appvar: $[stageDependencies.Subway_IOS_NA_GatedBuild.UAT_BuildAndRelease_GatedBuild.outputs['buildnumber.UPDATED_BUILD_NUMBER']]
      PRNumber: $[stageDependencies.Subway_IOS_NA_GatedBuild.StoreValidationAndNotification.outputs['GetPR.PRNumber']]
      PRCreator: $[stageDependencies.Subway_IOS_NA_GatedBuild.StoreValidationAndNotification.outputs['GetPR.PRCreator']]
      PRSourceBranch: $[stageDependencies.Subway_IOS_NA_GatedBuild.StoreValidationAndNotification.outputs['GetPR.SourceBranch']]
      PRTargetBranch: $[stageDependencies.Subway_IOS_NA_GatedBuild.StoreValidationAndNotification.outputs['GetPR.TargetBranch']]
      PRTitle: $[stageDependencies.Subway_IOS_NA_GatedBuild.StoreValidationAndNotification.outputs['GetPR.PRTitle']]
  jobs:
  - template: azure-pipelines-CD.yml@goldsuite
    parameters:
      Browser: ios
      AppVersionNumber: $(appvar)
      MWEnvironment: cfa-uat
      Environment: swuat
      Scope: GoldSuite
      Area: DigitalApp
      Culture: en-US
      Store: "$(storeid)"
      GroupBased: All

- stage: Sonarqube
  dependsOn: []
  condition: eq(variables['RUN_SONARQUBE'], 'true')
  jobs:
  - job: Sonarqube_Result
    timeoutInMinutes: 0
    cancelTimeoutInMinutes: 2
    steps:
      - template: ../SonarQube/ios-sonarqube-templateone.yml
