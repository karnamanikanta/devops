  - stage: 'FL_PROD'
    displayName: 'FL_PROD'
    jobs:
    - job: FL_PROD
      timeoutInMinutes: 0
      cancelTimeoutInMinutes: 2
      variables:
        - template: EMEA_FINLAND/variables/var-production-Finland-flavor.yml
      steps:
        - template: EMEA_FINLAND/template/ios-azure-prod-FN-fastlane-template.yml
        - powershell: |
            echo "AppVersion from template: $(AppVersion)"
            echo "BuildNumber from template: $(BuildNumber)"
            echo "Firebase Download URL: $(FirebaseURL)"
            echo "Firebase Console URL: $(FirebaseConsoleURL)"
            echo "Firebase Release URL: $(FirebaseReleaseURL)"
            echo "##vso[task.setvariable variable=AppVersion;isOutput=true]$(AppVersion)"
            echo "##vso[task.setvariable variable=BuildNumber;isOutput=true]$(BuildNumber)"
            echo "##vso[task.setvariable variable=FirebaseURL;isOutput=true]$(FirebaseURL)"
            echo "##vso[task.setvariable variable=FirebaseConsoleURL;isOutput=true]$(FirebaseConsoleURL)"
            echo "##vso[task.setvariable variable=FirebaseReleaseURL;isOutput=true]$(FirebaseReleaseURL)"
          name: DisplayReleaseDetails
    
    - job: FINLAND_Sonarqube
      pool:
        name: Azure Pipelines
        vmImage: macOS-15
        demands:
          - xcode 
      displayName: 'Production_Sonarqube'
      timeoutInMinutes: 0
      cancelTimeoutInMinutes: 2
      variables:
          - template: EMEA_FINLAND/variables/var-EMEA-sonarqube-flavor.yml
      steps:
          - template: EMEA_FINLAND/SonarQube/ios-sonarqube-template.yml
          - powershell: |
             echo "SonarQube URL from template: $(SonarQubeBranchURL)"
             echo "##vso[task.setvariable variable=SonarQubeBranchURL;isOutput=true]$(SonarQubeBranchURL)"
            name: DisplayReleaseDetails

    - job: SendEmail
      dependsOn: 
        - FL_PROD
        - FINLAND_Sonarqube
      displayName: 'Send Email Notification'
      pool:
        name: SubwaycomOn-PremAgentPool
      condition: |
        and(
          in(dependencies.FL_PROD.result, 'Succeeded', 'SucceededWithIssues'),
          in(dependencies.FINLAND_Sonarqube.result, 'Succeeded', 'SucceededWithIssues', 'Failed')
        )
      variables:
        AppVersion: $[ dependencies.FL_PROD.outputs['DisplayReleaseDetails.AppVersion'] ]
        BuildNumber: $[ dependencies.FL_PROD.outputs['DisplayReleaseDetails.BuildNumber'] ]
        FirebaseURL: $[ dependencies.FL_PROD.outputs['DisplayReleaseDetails.FirebaseURL'] ]
        FirebaseConsoleURL: $[ dependencies.FL_PROD.outputs['DisplayReleaseDetails.FirebaseConsoleURL'] ]
        FirebaseReleaseURL: $[ dependencies.FL_PROD.outputs['DisplayReleaseDetails.FirebaseReleaseURL'] ]
        FirebaseAppDistribution: 'SUBWAY Finland Production'
        SonarQubeBranchURL: $[ dependencies.FINLAND_Sonarqube.outputs['DisplayReleaseDetails.SonarQubeBranchURL'] ]
      steps:
      - checkout: none
      - template: EMEA_FINLAND/template/Finland_PROD_send_email_template.yml



  - stage: 'FL_Sonarqube'
    displayName: 'FL_Sonarqube'
    jobs:
    - job: Sonarqube_Result
      timeoutInMinutes: 0
      cancelTimeoutInMinutes: 2
      variables:
        - template: EMEA_FINLAND/variables/var-EMEA-sonarqube-flavor.yml
      steps:
        - template: EMEA_FINLAND/SonarQube/ios-sonarqube-template.yml
        - powershell: |
             echo "SonarQube URL from template: $(SonarQubeBranchURL)"
             echo "##vso[task.setvariable variable=SonarQubeBranchURL;isOutput=true]$(SonarQubeBranchURL)"
          name: DisplayReleaseDetails
