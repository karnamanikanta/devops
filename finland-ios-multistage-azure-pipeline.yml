  - stage: 'Finland_WireMock'
    displayName: 'Finland_WireMock'
    jobs:
    - job: Finland_WireMock
      timeoutInMinutes: 0
      cancelTimeoutInMinutes: 2
      variables:
        - template: EMEA_FINLAND/variables/var-WIREMOCK-Finland-flavor.yml
      steps:
        - template: EMEA_FINLAND/template/ios-azure-non_prod-FN-fastlane-template.yml
        - powershell: |
            echo "AppVersion from template: $(AppVersion)"
            echo "BuildNumber from template: $(BuildNumber)"
            echo "Firebase Download URL: $(FirebaseURL)"
            echo "Firebase Console URL: $(FirebaseConsoleURL)"
            echo "Firebase Release URL: $(FirebaseReleaseURL)"
            echo "##vso[task.setvariable variable=AppVersion;isOutput=true]$(AppVersion)"
            echo "##vso[task.setvariable variable=BuildNumber;isOutput=true]$(BuildNumber)"
            echo "##vso[task.setvariable variable=FirebaseURL;isOutput=true]$(FirebaseURL)"
            echo "##vso[task.setvariable variable=FirebaseConsoleURL;isOutput=true]$(FirebaseConsoleURL)"
            echo "##vso[task.setvariable variable=FirebaseReleaseURL;isOutput=true]$(FirebaseReleaseURL)"
          name: DisplayReleaseDetails

    - job: SendEmail
      dependsOn: Finland_WireMock
      displayName: 'Send Email Notification'
      pool:
        name: SubwaycomOn-PremAgentPool
        condition: or(eq(dependencies.Finland_WireMock.result, 'succeeded'), eq(dependencies.Finland_WireMock.result, 'succeededWithIssues'))
      variables:
        AppVersion: $[ dependencies.Finland_WireMock.outputs['DisplayReleaseDetails.AppVersion'] ]
        BuildNumber: $[ dependencies.Finland_WireMock.outputs['DisplayReleaseDetails.BuildNumber'] ]
        FirebaseURL: $[ dependencies.Finland_WireMock.outputs['DisplayReleaseDetails.FirebaseURL'] ]
        FirebaseConsoleURL: $[ dependencies.Finland_WireMock.outputs['DisplayReleaseDetails.FirebaseConsoleURL'] ]
        FirebaseReleaseURL: $[ dependencies.Finland_WireMock.outputs['DisplayReleaseDetails.FirebaseReleaseURL'] ]
        FirebaseAppDistribution: 'IOS EMEA Finland'
      steps:
      - checkout: none
      - template: devops_files/non-prod/send_email_template.yml
      
