name: $(Rev:r)
trigger:
- none
variables:
  - group: EmailRecipients
  - group: P12Password_Lowersandprod

pool:
  name: Azure Pipelines
  vmImage: macOS-15
  demands:
  - xcode

stages:
  - stage: 'Germany_WireMock'
    displayName: 'Germany_WireMock'
    jobs:
    - job: Germany_WireMock
      timeoutInMinutes: 0
      cancelTimeoutInMinutes: 2
      variables:
        - template: Germany/variables/var-WIREMOCK-Germany-flavor.yml
      steps:
        - template: Germany/templates/Germany-ios-azure-non_prod-fastlane-template.yml
        - powershell: |
            echo "AppVersion from template: $(AppVersion)"
            echo "BuildNumber from template: $(BuildNumber)"
            echo "Firebase Download URL: $(FirebaseURL)"
            echo "Firebase Console URL: $(FirebaseConsoleURL)"
            echo "Firebase Release URL: $(FirebaseReleaseURL)"
            echo "##vso[task.setvariable variable=AppVersion;isOutput=true]$(AppVersion)"
            echo "##vso[task.setvariable variable=BuildNumber;isOutput=true]$(BuildNumber)"
            echo "##vso[task.setvariable variable=FirebaseURL;isOutput=true]$(FirebaseURL)"
            echo "##vso[task.setvariable variable=FirebaseConsoleURL;isOutput=true]$(FirebaseConsoleURL)"
            echo "##vso[task.setvariable variable=FirebaseReleaseURL;isOutput=true]$(FirebaseReleaseURL)"
          name: DisplayReleaseDetails

    - job: SendEmail
      dependsOn: Germany_WireMock
      displayName: 'Send Email Notification'
      pool:
        name: SubwaycomOn-PremAgentPool
        condition: or(eq(dependencies.Germany_WireMock.result, 'succeeded'), eq(dependencies.Germany_WireMock.result, 'succeededWithIssues'))
      variables:
        AppVersion: $[ dependencies.Germany_WireMock.outputs['DisplayReleaseDetails.AppVersion'] ]
        BuildNumber: $[ dependencies.Germany_WireMock.outputs['DisplayReleaseDetails.BuildNumber'] ]
        FirebaseURL: $[ dependencies.Germany_WireMock.outputs['DisplayReleaseDetails.FirebaseURL'] ]
        FirebaseConsoleURL: $[ dependencies.Germany_WireMock.outputs['DisplayReleaseDetails.FirebaseConsoleURL'] ]
        FirebaseReleaseURL: $[ dependencies.Germany_WireMock.outputs['DisplayReleaseDetails.FirebaseReleaseURL'] ]
        FirebaseAppDistribution: 'iOS EMEA GERMANY SANDBOX'
      steps:
      - checkout: none
      - template: devops_files/non-prod/send_email_template.yml

