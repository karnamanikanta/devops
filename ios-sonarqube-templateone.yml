steps:

    - task: PowerShell@2
      displayName: 'Check for Hardcoded Sensitive Data'
      inputs:
        targetType: 'filePath'
        filePath: '$(Build.SourcesDirectory)/Subway/cicd/NA/SonarQube/scripts/hardcoded-check.ps1'
        pwsh: true

    - task: SonarQubePrepare@7
      displayName: 'SonarQube Prepare Task'
      inputs:
        SonarQube: 'sonarqube-subway-mob-ios'
        scannerMode: 'CLI'
        configMode: 'manual'
        cliProjectKey: 'Guest-MobileApps_subway-mob-ios'
        cliSources: '.'
        extraProperties: |
          sonar.language=swift
          sonar.c.file.suffixes=-
          sonar.cpp.file.suffixes=-
          sonar.objc.file.suffixes=-
          sonar.verbose=true
          sonar.cfamily.build-wrapper-output.bypass=true
          sonar.coverageReportPaths=$(system.defaultworkingdirectory)/sonarqube-generic-coverage.xml
