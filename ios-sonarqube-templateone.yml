          #sonar.exclusions=*.rb,**/*.js,**/*.storyboard,**/*.xib,**/*.xml,**/*.json,**/*.h,**/*.m,**/*.entitlements,**/*.txt,**/*.intentdefinition,**/*.der,**/*.cer,**/*.html,Subway/Firebase/**,Source/Images.xcassets/**,Pods/**,Subway/SUBWAY®UITests/**/*,**/*Tests.swift,Subway/SubwayTests/**/*,Subway/Frameworks/**/*
          sonar.coverage.exclusions=**/*ViewController.swift,**/*NavController.swift,**/*FlowController.swift,**/*OrderController.swift,**/*View.swift,**/*Cell.swift,**/*Header.swift,**/*Footer.swift,**/*Label.swift,**/*TextField.swift,**/*StepperControl.swift,**/*Button.swift,Subway/SubwayTests/**/*,Subway/SUBWAY®UITests/**/*,Subway/CICD/**/*,**/*AppDelegate.swift,**/*Tests.swift,**/*Analytics.swift,**/*MapsHelper.swift,**/*CarouselCollectionViewLayout.swift,**/*IncrementalTableViewBindingHelper.swift,**/*Constants.swift,**/*AdobeJSONExtractor.swift,**/*SubwayAdapter.swift,**/*PaymentDetailsAnimator.swift,**/*CrossFadeAnimator.swift,ActionSheetAnimator.swift,**/*DeepLinker.swift,**/*ExpireDateFormatter.swift,**/*BKMoneyUtils.swift,**/*JVFloatLabeledTextField.m,**/*NSString+TextDirectionality.m,**/*BranchDeepLinker.swift,**/*ZipCodeReverseGeocoder.swift,**/*CartModifiable.swift,**/*NetworkAdobeTestingService.swift,**/*DisplayType.swift,**/*SwinjectStoryboard+Extensions.swift,**/*LocalisationHelper.swift,**/*UIViewController+Extensions.swift,**/*SwinjectStoryboard+Extensions.swift,**/*SignInViewController+Azure.swift,**/*NetworkAzureService.swift,**/*InAppNotificationViewcontroller.swift,**/*ObjectiveCBridging.swift,**/*TierStatusSlider.swift,**/*NetworkMenuService.swift,**/*RewardListItem.swift,**/*StoreCloseAlertDisplayer.swift,**/*ObjectiveCBridging.swift,**/*xccov-json-to-cobertura-xml.swift,**/*RewardsSlider.swift,**/*ReOrderData.swift,**/*CartPageConfigurations.swift,**/*RedeemPointsSlider.swift,**/*StoreCloseAlertDisplayer.swift,**/*RedeemPointsSlider.swift,**/*NotificationDisplayer.swift,**/*NotificationService.swift,**/*CartPageConfigurations.swift,**/*NavigationBar+Extensions.swift,**/*UIView+Extensions.swift,**/*UIView+Extensions.swift,**/*NSAttributedString+Extensions.swift,**/*NotificationService.swift,**/*UITapGestureRecognizer+Extension.swift,**/*ACPCampaignClassicHelper.swift,**/*NetworkApptentiveService.swift,**/*AuthenticationService.swift,**/*Guest